name: 🔁 CI — Lint · Type · Audit · Test · Build

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Code Quality — Lint, Format, TypeScript
  # ─────────────────────────────────────────────────────────────
  quality:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci || npm install --prefer-offline

      - name: 🎨 Prettier format check
        run: npx prettier --check "src/**/*.{ts,tsx,css}" || true

      - name: 🔍 ESLint
        run: npm run lint || true

      - name: 🏷️ TypeScript type-check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Security — Audit de dependências + Secret Scanning
  # ─────────────────────────────────────────────────────────────
  security-quick:
    name: 🔒 Security Quick Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci || npm install --prefer-offline

      - name: 🛡️ npm audit report
        run: |
          npm audit --json > npm-audit-report.json || true
          echo "## 🛡️ NPM Audit Summary" >> $GITHUB_STEP_SUMMARY
          node -e "
            try {
              const d = JSON.parse(require('fs').readFileSync('npm-audit-report.json','utf8'));
              const v = d.metadata?.vulnerabilities || {};
              console.log('| Critical | High | Moderate | Low |');
              console.log('|---|---|---|---|');
              console.log(\`| \${v.critical||0} | \${v.high||0} | \${v.moderate||0} | \${v.low||0} |\`);
            } catch(e) { console.log('Audit completed'); }
          " >> $GITHUB_STEP_SUMMARY || true

      - name: 🔑 Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: ⬆️ Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Unit Tests com Vitest + Coverage
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci || npm install --prefer-offline

      - name: 🧪 Run Vitest with coverage
        run: npm run test:coverage
        env:
          VITE_SUPABASE_URL: "https://test.supabase.co"
          VITE_SUPABASE_ANON_KEY: "test-anon-key"

      - name: 📊 Coverage summary
        run: |
          echo "## 🧪 Test Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            cat coverage/coverage-summary.json | node -e "
              try {
                const c = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).total;
                console.log('| Metric | % | Covered | Total |');
                console.log('|--------|---|---------|-------|');
                Object.entries(c).forEach(([k,v]) => console.log(\`| \${k} | \${v.pct}% | \${v.covered} | \${v.total} |\`));
              } catch(e) {}
            " >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: ⬆️ Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Build validation
  # ─────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, security-quick]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci || npm install --prefer-offline

      - name: 🏗️ Build project
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://vtupzxfjqtjyojcckduu.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}

      - name: ⬆️ Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Status gate
  # ─────────────────────────────────────────────────────────────
  ci-status:
    name: ✅ CI Status Gate
    runs-on: ubuntu-latest
    needs: [quality, security-quick, test, build]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ||
                "${{ needs.security-quick.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed!"
            exit 1
          fi
          echo "✅ All CI checks passed!"
