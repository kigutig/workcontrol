name: 🛡️ DevSecOps — Security Scans

on:
  schedule:
    - cron: "0 8 * * 1"
  push:
    branches: [main]
    paths:
      - "package*.json"
      - "src/**"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: SBOM Generation (Software Bill of Materials)
  # ─────────────────────────────────────────────────────────────
  sbom:
    name: 📋 SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci || npm install --prefer-offline

      - name: 📋 Generate SBOM (CycloneDX)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file sbom-cyclonedx.json \
            --flatten-components \
            --mc-type application || true

      - name: ⬆️ Upload SBOM report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-report
          path: sbom-cyclonedx.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Trivy Filesystem Scan
  # ─────────────────────────────────────────────────────────────
  trivy-scan:
    name: 🔬 Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔬 Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Semgrep SAST
  # ─────────────────────────────────────────────────────────────
  semgrep:
    name: 🔍 Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔍 Semgrep scan
        run: |
          semgrep \
            --config=auto \
            --config=p/typescript \
            --config=p/react \
            --config=p/owasp-top-ten \
            --json \
            --output=semgrep-results.json \
            . || true

      - name: ⬆️ Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-results.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Security Summary
  # ─────────────────────────────────────────────────────────────
  security-summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [sbom, trivy-scan, semgrep]
    if: always()
    steps:
      - name: 📊 Summary report
        run: |
          echo "# 🛡️ DevSecOps Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 SBOM CycloneDX | ${{ needs.sbom.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔬 Trivy FS Scan | ${{ needs.trivy-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Semgrep SAST | ${{ needs.semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
