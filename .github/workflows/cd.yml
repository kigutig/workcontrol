name: 🚀 CD — Deploy Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment"
        required: true
        default: "preview"
        type: choice
        options: [preview, production]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Preview Deploy (PRs que não sejam de bots sem secrets)
  # ─────────────────────────────────────────────────────────────
  preview:
    name: 🔍 Preview Deploy (Vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && secrets.VERCEL_TOKEN != ''
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci || npm install --prefer-offline

      - name: 🔗 Setup Vercel project configuration
        run: |
          mkdir -p .vercel
          echo "{\"projectId\":\"${{ secrets.VERCEL_PROJECT_ID }}\",\"orgId\":\"${{ secrets.VERCEL_ORG_ID }}\"}" > .vercel/project.json

      - name: 🏗️ Build with Vercel CLI
        run: npx vercel build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 🚀 Deploy to Vercel (Preview)
        id: deploy
        run: |
          DEPLOY_OUTPUT=$(npx vercel deploy --prebuilt)
          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[^ >]+' | tail -1)
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "✅ Preview URL: $PREVIEW_URL"

      - name: 💬 Comment Preview URL on PR
        uses: actions/github-script@v7
        if: steps.deploy.outputs.preview_url != ''
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = '${{ steps.deploy.outputs.preview_url }}';
            const body = `## 🚀 Preview Deploy (Vercel)\n\n` +
              `| Propriedade | Valor |\n` +
              `|-------------|-------|\n` +
              `| 🔗 URL | [${url}](${url}) |\n` +
              `| 📦 Commit | \`${{ github.sha }}\` |\n` +
              `| 🌿 Branch | \`${{ github.head_ref }}\` |\n\n` +
              `> ⚡ Preview atualizado automaticamente a cada novo commit.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Production Deploy (push para main)
  # ─────────────────────────────────────────────────────────────
  production:
    name: 🏭 Production Deploy (Vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    outputs:
      production_url: ${{ steps.deploy.outputs.production_url }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci || npm install --prefer-offline

      - name: 🔗 Setup Vercel project configuration
        run: |
          mkdir -p .vercel
          echo "{\"projectId\":\"${{ secrets.VERCEL_PROJECT_ID }}\",\"orgId\":\"${{ secrets.VERCEL_ORG_ID }}\"}" > .vercel/project.json

      - name: 🏗️ Build project for Production
        run: npx vercel build --prod
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 🚀 Deploy to Vercel (Production)
        id: deploy
        run: |
          DEPLOY_OUTPUT=$(npx vercel deploy --prebuilt --prod)
          PROD_URL=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[^ >]+' | tail -1)
          echo "production_url=$PROD_URL" >> $GITHUB_OUTPUT
          echo "✅ Production URL: $PROD_URL"

      - name: 📊 Deploy summary
        run: |
          echo "## 🚀 Production Deploy" >> $GITHUB_STEP_SUMMARY
          echo "| Propriedade | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 URL | ${{ steps.deploy.outputs.production_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Author | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

      - name: 🏷️ Create Release Tag
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const date = new Date().toISOString().split('T')[0].replace(/-/g, '.');
            const sha = context.sha.substring(0, 7);
            const tagName = `release-${date}-${sha}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: context.sha
              });
              console.log(`✅ Tag criada: ${tagName}`);
            } catch (e) {
              console.log(`⚠️ Tag skipped: ${e.message}`);
            }
