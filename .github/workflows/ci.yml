name: 🔁 CI — Lint · Type · Audit · Test · Build

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Code Quality — Lint, Format, TypeScript
  # ─────────────────────────────────────────────────────────────
  quality:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 🎨 Prettier format check
        run: npx prettier --check "src/**/*.{ts,tsx,css}" --log-level warn

      - name: 🔍 ESLint
        run: npm run lint -- --max-warnings=0

      - name: 🏷️ TypeScript type-check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Security — Audit de dependências + Secret Scanning
  # ─────────────────────────────────────────────────────────────
  security-quick:
    name: 🔒 Security Quick Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 🛡️ npm audit (high severity)
        run: npm audit --audit-level=high --json > npm-audit-report.json || true

      - name: 📋 Parse npm audit results
        run: |
          echo "## 🛡️ NPM Audit Results" >> $GITHUB_STEP_SUMMARY
          VULNS=$(cat npm-audit-report.json | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const v = d.metadata?.vulnerabilities || {};
            console.log('Critical:', v.critical||0, '| High:', v.high||0, '| Moderate:', v.moderate||0, '| Low:', v.low||0);
          " 2>/dev/null || echo "Could not parse audit")
          echo "$VULNS" >> $GITHUB_STEP_SUMMARY
          # Fail on critical vulnerabilities
          CRITICAL=$(cat npm-audit-report.json | node -e "
            const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            process.exit((d.metadata?.vulnerabilities?.critical||0)>0?1:0);
          " 2>/dev/null) || { echo "❌ Critical vulnerabilities found!"; exit 1; }
          echo "✅ No critical vulnerabilities"

      - name: 🔑 Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: ⬆️ Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Unit Tests com Vitest + Coverage
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 🧪 Run Vitest with coverage
        run: npm run test:coverage
        env:
          VITE_SUPABASE_URL: "https://test.supabase.co"
          VITE_SUPABASE_ANON_KEY: "test-anon-key"

      - name: 📊 Coverage summary
        run: |
          echo "## 🧪 Test Coverage" >> $GITHUB_STEP_SUMMARY
          cat coverage/coverage-summary.json | node -e "
            const c = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).total;
            console.log('| Metric | % | Covered | Total |');
            console.log('|--------|---|---------|-------|');
            Object.entries(c).forEach(([k,v]) => console.log(\`| \${k} | \${v.pct}% | \${v.covered} | \${v.total} |\`));
          " 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "Coverage summary not available"

      - name: ⬆️ Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: 📈 Coverage report to PR comment
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request'
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Build validation
  # ─────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, security-quick]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 🏗️ Build project
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: 📏 Bundle size analysis
        run: |
          echo "## 📦 Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          find dist -name "*.js" -o -name "*.css" | head -20 | while read f; do
            size=$(du -sh "$f" | cut -f1)
            echo "| $f | $size |" >> $GITHUB_STEP_SUMMARY
          done || echo "| dist/ | - |" >> $GITHUB_STEP_SUMMARY

      - name: ⬆️ Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Status gate — todos os jobs devem passar
  # ─────────────────────────────────────────────────────────────
  ci-status:
    name: ✅ CI Status Gate
    runs-on: ubuntu-latest
    needs: [quality, security-quick, test, build]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ||
                "${{ needs.security-quick.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed!"
            exit 1
          fi
          echo "✅ All CI checks passed!"
